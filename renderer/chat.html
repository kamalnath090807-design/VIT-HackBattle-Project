<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AURA — Terminal Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="chat-box-standalone">
    <div id="chat-inner">
      <!-- Draggable Header -->
      <div id="chat-header">
        <span id="chat-header-icon">◈</span>
        <span id="chat-header-title">AURA · Command Terminal</span>
        <!-- Target Mode Toggle Button: PC ⇄ Mobile -->
        <button class="target-mode-single-btn" id="btn-target-toggle" type="button" onclick="toggleAutomationTargetMode()" title="Click to switch PC ⇄ Mobile Automation">
          <span class="mode-icon" id="target-mode-icon">💻</span>
          <span class="mode-label" id="target-mode-label">PC</span>
        </button>
        <!-- Mode Badge / Automation Control Button -->
        <button class="target-mode-single-btn mode-auto" id="btn-pipeline-toggle" type="button" onclick="toggleAutomationMode()" title="Execution Pipeline: AUTO (Click to switch to Supervised)">
          <span id="pipeline-mode-label">AUTO</span>
        </button>
        <!-- Window Controls -->
        <div id="chat-header-actions">
          <button id="chat-minimize-btn" onclick="minimizeWindow()" title="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button id="chat-clear-btn" onclick="clearThread()" title="Clear Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button id="chat-close-btn" onclick="closeWindow()" title="Close (Shift+Z)">✕</button>
        </div>
      </div>
      <!-- Scrollable Message Thread -->
      <div id="chat-thread">
        <div class="chat-welcome">
          <div class="chat-welcome-title">AURA Core Online</div>
          <div class="chat-welcome-sub">Enter a direct PC command, mobile intent, or file query below.</div>
        </div>
      </div>
      <!-- Attached File Staging Preview Bar -->
      <div id="chat-file-preview" class="chat-preview-hidden">
        <div id="chat-preview-thumb-box">
          <img id="chat-preview-img" style="display:none"/>
          <span id="chat-preview-icon">📎</span>
        </div>
        <span id="chat-preview-name"></span>
        <button id="chat-preview-remove" onclick="removeFileAttachment()" title="Remove file">✕</button>
      </div>
      <!-- Action Input Row -->
      <div id="chat-input-row">
        <!-- Hidden file input for attachment picker -->
        <input type="file" id="chat-file-input" accept="image/*,.pdf,.txt,.py,.js,.html,.css,.json,.md" style="display:none" onchange="handleFileSelect(event)"/>
        
        <!-- Paperclip / File Attachment Button -->
        <button id="chat-upload-btn" onclick="triggerFileUpload()" title="Attach image or document">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <!-- Screen Vision Button -->
        <button id="chat-screen-btn" onclick="triggerScreenAnalysis()" title="Analyze visible screen display">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
        </button>
        <!-- Auto-expanding Textarea -->
        <textarea id="chat-input" placeholder="Type a command (or drop a file)…" rows="1" spellcheck="false"></textarea>
        <!-- Send Button -->
        <button id="chat-send" onclick="sendChat()" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- Syntax Highlighting & Math Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
